<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="1400" height="850" fill="#f4efe7"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2c2925}.t{font-size:34px;font-weight:700}.s{font-size:22px}.n{font-size:18px;fill:#718896}.o{stroke:#2c2925;stroke-width:4}</style><text x="60" y="62" class="t">右侧板前烧鸟区｜平面详图示意</text><text x="60" y="96" class="n">核心约束：师傅背对客人操作；正面不直接暴露完整厨房</text><rect x="130" y="155" width="1110" height="530" fill="#fffaf3" class="o"/><rect x="170" y="190" width="1030" height="100" fill="#2c2925"/><text x="450" y="250" class="s" fill="white">后墙设备 / 酒柜 / 清洗 / 炸物 / 饮品工作带</text><rect x="170" y="320" width="800" height="105" fill="#a06f3c"/><text x="400" y="382" class="s" fill="white">烧鸟炉与操作台｜约4m长 / 深约65cm</text><g fill="#3f5b45"><circle cx="300" cy="465" r="30"/><circle cx="500" cy="465" r="30"/><circle cx="700" cy="465" r="30"/><circle cx="900" cy="465" r="30"/></g><text x="470" y="520" class="n">师傅面向炉具、背对客人｜操作通道建议约80cm</text><rect x="170" y="555" width="800" height="45" fill="#d99a3d"/><text x="445" y="585" class="n">板前台 / 岛台｜深约20cm</text><g fill="#2c2925"><circle cx="260" cy="645" r="25"/><circle cx="410" cy="645" r="25"/><circle cx="560" cy="645" r="25"/><circle cx="710" cy="645" r="25"/><circle cx="860" cy="645" r="25"/></g><text x="430" y="720" class="s">板前客人｜用餐区深约35cm</text><rect x="1010" y="425" width="190" height="200" fill="#718896" class="o"/><text x="1045" y="515" class="s" fill="white">展示冰箱</text><text x="1062" y="550" class="n" fill="white">约2m宽</text><text x="1015" y="655" class="n">外部视觉锚点 / 入口</text></svg>